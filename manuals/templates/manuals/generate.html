{% extends "manuals/base.html" %}
{% block title %}Generate a manual{% endblock %}
{% block content %}
  <h1>Generate a manual with AI</h1>
  <form method="post" onsubmit="this.querySelector('button').setAttribute('aria-busy', 'true')">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Generate</button>
  </form>
  <small>Generation takes from a few seconds to about a minute.</small>
{% endblock %}
